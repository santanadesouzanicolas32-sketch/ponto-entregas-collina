<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0f0a">
<meta name="description" content="Acompanhamento do desenvolvimento individual dos entregadores do Empório Collina.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gerência · Ponto Collina">
<meta name="robots" content="noindex">
<title>Gerência · Ponto Collina</title>
<link id="ico" rel="icon">
<link id="ico2" rel="apple-touch-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a0f0a; --card:#26160e; --card2:#332014; --line:#4d3322;
  --gold:#cfa24f; --gold2:#ecd093; --txt:#f6ecda; --mut:#b8a38a;
  --ok:#8cc98a; --warn:#e3a64a; --bad:#ee7468;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
header{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#7a5a22);display:grid;place-items:center;color:#1a0f0a;font-weight:800;font-size:18px}
header h1{font-size:15px;margin:0;line-height:1.15;letter-spacing:.2px}
header small{color:var(--mut);font-size:11px;display:block;font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);margin:0 0 10px;font-weight:600}
.big{font-size:54px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
.gold{color:var(--gold2)}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mut)}
.stat i{font-style:normal;font-size:11px}
.up{color:var(--ok)}.down{color:var(--bad)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{display:block;width:100%;padding:16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:16px}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a0f0a;border:0}
.btn.red{background:#3b1612;border-color:#6a2c26;color:#ffb4aa}
.btn.sm{padding:10px 14px;font-size:14px;width:auto}
.btn:active{transform:scale(.98)}
.progress{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;margin:8px 0 4px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 0;flex:1 0 28%;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:17px;text-align:center}
.chip.on{background:var(--gold);color:#1a0f0a;border-color:var(--gold)}
input,select{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%;font-size:18px}
input:focus{outline:2px solid var(--gold)}
label{font-size:12px;color:var(--mut);display:block;margin:12px 0 6px}
/* lista */
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);width:100%;text-align:left;background:none}
.item:first-child{border-top:0}
.item .dest{font-size:20px;font-weight:700;min-width:84px}
.item .t{color:var(--mut);font-variant-numeric:tabular-nums;font-size:14px}
.item .gap{margin-left:auto;color:var(--mut);font-size:12px}
.badge{font-size:10px;padding:3px 7px;border-radius:99px;background:#4d3a15;color:var(--warn);font-weight:700}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#150b07ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;padding:12px 0 10px;background:none;color:var(--mut);font-size:12px;font-weight:600}
nav button.on{color:var(--gold2)}
nav button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
/* acao fixa */
.dock{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:15;padding:0 14px 10px;pointer-events:none}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px;pointer-events:auto}
.dock .photo{flex:1;padding:20px;border-radius:18px;font-size:18px;box-shadow:0 8px 24px #0009}
.dock .manual{width:84px;padding:20px 0;border-radius:18px;box-shadow:0 8px 24px #0009;background:var(--card2);border:1px solid var(--line);font-weight:700}
/* sheet */
.scrim{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:flex-end}
.scrim.on{display:flex}
.sheet{background:var(--card);border-radius:24px 24px 0 0;border:1px solid var(--line);width:100%;max-width:560px;margin:0 auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:18px}
/* graficos */
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:6px}
.bars div{flex:1;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div.hit{background:var(--ok)}
.bars div.dim{background:var(--line)}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:4px}
.hrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.hrow .k{width:64px;color:var(--mut)}
.hrow .b{flex:1;height:12px;background:var(--card2);border-radius:99px;overflow:hidden}
.hrow .b>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.hrow .v{width:34px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:10px;background:none;color:var(--mut);font-weight:600}
.seg button.on{background:var(--gold);color:#1a0f0a}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.scroll{overflow-x:auto;margin:0 -4px}
.hide{display:none!important}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--gold);color:#1a0f0a;padding:10px 16px;border-radius:99px;font-weight:700;z-index:60;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:20px 0;font-size:14px}
/* shell de empresa */
.topbar{position:sticky;top:0;z-index:18;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#150b07ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .ttl b{display:block;font-size:16px}
.topbar .ttl small,nav .brand small{color:var(--mut);font-size:11px;display:block}
.avatar{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--gold);color:var(--gold2);font-weight:700;font-size:15px}
nav .brand{display:none}
nav button span{display:block}
#login{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#3a2314,var(--bg) 60%)}
#login.on{display:grid}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;box-shadow:0 20px 60px #0008}
.lbox h1{margin:14px 0 2px;font-size:22px}
.lbox p{margin:0}
.logo.big{width:56px;height:56px;font-size:28px}
.lbox label{margin-top:16px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{flex:1 1 160px;font-size:15px;padding:11px 12px}
.toolbar select{flex:0 0 auto;width:auto;font-size:15px;padding:11px 12px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hello{font-size:20px;font-weight:700;margin:2px 0 14px}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--mut)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.status.on i{background:var(--ok)}.status.pz i{background:var(--warn)}
@media(min-width:900px){
  body{padding-bottom:110px}
  nav{top:0;bottom:auto;right:auto;width:236px;height:100dvh;flex-direction:column;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--line);background:#150b07}
  nav .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 22px}
  nav .brand b{font-size:14px}
  nav button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;font-size:14px;flex:0 0 auto}
  nav button svg{margin:0}
  nav button.on{background:var(--card2)}
  .topbar,.wrap{margin-left:236px}
  .wrap{max-width:860px;padding:22px 28px 0}
  .kpi{grid-template-columns:repeat(4,1fr)}
  .dock{left:236px;bottom:0}
  .dock .in{max-width:860px;padding:0 28px}
  .scrim{align-items:center}
  .sheet{border-radius:24px;max-width:480px}
}
/* v2: tipografia e Turno enxuto */
body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hello,.count b,.trio b,.times b,.stat b,.lbox h1,.sheet h3{font-family:"Fraunces",Georgia,serif;font-weight:600}
.hello{font-size:26px;margin:4px 2px 16px}
.count b{font-size:46px;line-height:1}.count span{color:var(--mut);font-size:18px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio b{display:block;font-size:24px;line-height:1.1}
.trio span{font-size:11px;color:var(--mut)}
.trio em{font-style:normal;font-weight:700;font-size:11px}
.card{border-radius:16px}
.shiftbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.times{display:flex;align-items:center;gap:14px}
.times i{width:28px;height:1px;background:var(--line)}
.times span{display:block;font-size:11px;color:var(--mut)}
.times b{font-size:24px}
.acts{display:flex;gap:8px}
.acts .btn{display:flex;align-items:center;gap:6px}
.btn.start{padding:20px 0}.btn.start b{display:block;font-family:"Fraunces",Georgia,serif;font-size:30px}.btn.start small{font-size:12px;font-weight:600}
.dock .photo{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 10px;white-space:nowrap;min-width:0;font-size:16px}
.dock .photo svg{flex:none}
.dock .manual{flex:none;width:72px;padding:18px 0;font-size:14px}
.lockp{display:flex;align-items:center;gap:6px;font-size:13px;margin:12px 0 0}
details.card summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none}
details.card summary::after{content:"+";float:right;color:var(--gold2)}
details[open].card summary::after{content:"\2212"}
details.card[open] summary{margin-bottom:10px}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
/* v4: identidade Emporio Collina (chocolate, dourado, creme) */
body{background:var(--bg) repeating-linear-gradient(95deg,#ffffff03 0 2px,#00000000 2px 9px)}
.logo{background:radial-gradient(circle at 50% 35%,#2e1b11,#1a0f0a);border:2px solid var(--gold);color:var(--gold2);font-family:"Cinzel","Trajan Pro",Georgia,serif;font-weight:700;box-shadow:0 0 0 2px #1a0f0a,0 0 0 3px #cfa24f66}
.hello,.lbox h1,.sheet h3,.topbar .ttl b,nav .brand b{font-family:"Cinzel",Georgia,serif;font-weight:700;letter-spacing:.6px}
.topbar .ttl b{font-size:16px;text-transform:uppercase}
.lbox h1{font-size:22px;text-transform:uppercase;text-align:center}
.lbox .logo.big{margin:0 auto}
.lbox>p.mut{text-align:center;letter-spacing:1.4px;text-transform:uppercase;font-size:11px}
.btn.gold{color:#1a0f0a;background:linear-gradient(135deg,#ecd093,#cfa24f 55%,#b78a38)}
.btn.red{background:#3b1612;border-color:#7a2f27;color:#ffb9ae}
input,select{background:#2e1b11}
.card{background:linear-gradient(180deg,#26160e,#22130c)}
nav{background:#150b07f2}
.dock .manual{background:#2e1b11}
#login{background:radial-gradient(circle at 50% 0,#3a2314,#150b07 65%)}
.lbox{border-color:#6b5322;background:#22130c}
img.logo.big{width:104px;height:104px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 4px;padding:0;background:#1a0f0a}
/* v3: visual profissional */
:root{--bg:#150b07;--card:#22130c;--card2:#2e1b11;--line:#47301f}
body{background:var(--bg)}
.card{border:1px solid var(--line);box-shadow:none;padding:18px}
.card h2{font-size:11px;letter-spacing:1.2px;margin-bottom:12px}
.topbar{padding:12px 16px}
.topbar .ttl b{font-family:"Manrope",sans-serif;font-size:17px;font-weight:800}
.topbar .ttl small{font-size:12px}
.avatar{background:var(--card2);color:var(--gold2);border-color:#6b5322}
.btn{border-radius:12px;font-weight:700}
.btn.gold{box-shadow:0 1px 0 #fff3 inset,0 6px 18px #cfa24f33}
.item{padding:14px 2px;min-height:56px}
.item .dest{font-family:"Manrope",sans-serif;font-weight:800;font-size:19px;letter-spacing:.3px}
.item .t{font-weight:600;color:var(--txt);opacity:.75}
.progress{height:8px}
nav button{position:relative;font-weight:700;font-size:11px;letter-spacing:.2px}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.seg{border:1px solid var(--line);background:var(--card)}
.seg button{font-weight:700;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px}
tr:nth-child(even) td{background:#ffffff05}
@media(min-width:900px){
  nav button{padding:13px 14px}
  nav button.on::before{left:0;right:auto;top:20%;bottom:20%;width:3px;height:auto;border-radius:0 3px 3px 0}
  #v-turno{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
  #v-turno>.shiftbar,#v-turno>.pausebar,#v-turno>.hello{grid-column:1/-1}
  #v-turno>details{grid-column:1/-1}
}
.pausebar{background:#41300f;border:1px solid #7a6026;color:var(--gold2);text-align:center;padding:10px;border-radius:14px;margin-bottom:12px;font-weight:600}

/* Acréscimos da versão com backend: estados de carregamento, alertas, admin, tabelas */
.boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;background:var(--bg);z-index:200;color:var(--mut)}
.boot img{border-radius:50%;border:2px solid var(--gold)}
.offline{position:sticky;top:0;z-index:150;background:#5a2118;color:#ffd9d2;text-align:center;padding:10px 14px;font-size:13px;font-weight:600}
.lerr{color:var(--bad);min-height:20px;font-size:13px;margin:12px 0 0;text-align:center}
#login,#pwchange,#setup{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;overflow:auto;background:radial-gradient(circle at 50% 0,#3a2314,#150b07 65%)}
#login.hide,#pwchange.hide,#setup.hide{display:none!important}
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:14px;height:88px;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
.errbox{border:1px solid #7a2f27;background:#2c1410;color:#ffc9bf;border-radius:14px;padding:16px;margin-bottom:12px;font-size:14px}
.errbox .btn{margin-top:10px}
.alerts{display:grid;gap:8px;margin-bottom:12px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.alert i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--mut)}
.alert.warning{background:#3a2a0e;border-color:#7a6026;color:#f6dca0}.alert.warning i{background:var(--warn)}
.alert.success{background:#16301c;border-color:#2f6a3a;color:#bfe8c4}.alert.success i{background:var(--ok)}
.alert.info i{background:var(--gold)}
.proj{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mut)}
.proj b{color:var(--txt)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--card2)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.open i{background:var(--ok)}.pill.on_break i{background:var(--warn)}.pill.closed i{background:var(--mut)}
.pill.off{color:var(--bad)}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--mut);letter-spacing:.4px}
.tag.photo{color:var(--gold2)}
.tag.auto{background:#4d3a15;color:var(--warn)}
.item .dest{min-width:78px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-row>div{min-width:0}
textarea{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;font-size:16px;min-height:72px;resize:vertical}
textarea:focus{outline:2px solid var(--gold)}
.tbl-click tr[data-act]{cursor:pointer}
.tbl-click tr[data-act]:hover td{background:#ffffff08}
.num{text-align:right}
.good{color:var(--ok)}.bad{color:var(--bad)}.warnc{color:var(--warn)}
.toolbar .btn{width:auto}
.temp{font-family:ui-monospace,Consolas,monospace;font-size:20px;letter-spacing:1px;background:var(--card2);border:1px dashed var(--gold);border-radius:12px;padding:14px;text-align:center;user-select:all;word-break:break-all}
.diff{font-size:12px;color:var(--mut);margin:4px 0 0;word-break:break-word}
.logrow{padding:12px 0;border-top:1px solid var(--line);font-size:13px}
.logrow:first-child{border-top:0}
.logrow b{font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.loadmore{margin-top:12px}
.ocr-note{font-size:13px;margin:6px 0 0;padding:10px 12px;border-radius:12px;background:var(--card2)}
.ocr-note.warn{background:#3a2a0e;color:#f6dca0}
.break-row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.break-row:first-child{border-top:0}
@media(min-width:900px){#view{min-height:60vh}.toolbar input{flex:1 1 200px}}

/* static */
#selftest{position:fixed;inset:0;z-index:300;background:var(--bg);overflow:auto}
#selftest .kv{font-size:13px;gap:12px}
#selftest .kv span:last-child{text-align:right;word-break:break-word}
.offline.hide{display:none}
#storageWarn{top:0}
/* ---- valor, painel estilo Power BI ---- */
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:13px;color:var(--txt);cursor:pointer}
.chk input{width:20px;height:20px;margin-top:1px;flex:none}
.amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.toast.act{pointer-events:auto;display:flex;gap:12px;align-items:center}
.toast-btn{background:#1a0f0a;color:var(--gold2);border:0;border-radius:99px;padding:6px 12px;font-weight:800;cursor:pointer}
.bi-filters{position:sticky;top:calc(62px + env(safe-area-inset-top,0px));z-index:12;background:var(--bg);padding:10px 0 4px;margin:-6px 0 4px}
.bi-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;align-items:center}
.bi-row::-webkit-scrollbar{display:none}
.chip2{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.chip2.on{background:var(--gold);color:#1a0f0a;border-color:var(--gold)}
.chip2.alt{border-style:dashed}
.chip2.rm{background:#4d3a15;color:var(--gold2);border-color:#7a6026}
.linkbtn{background:none;border:0;color:var(--gold2);font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 4px;font-size:13px}
.bi-range{font-size:12px;margin:2px 2px 10px}
.bi-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(min-width:700px){.bi-kpis{grid-template-columns:repeat(3,1fr)}}
.kpi-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:hidden;min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi-card.strong{border-color:#7a6026;background:linear-gradient(180deg,#2e1b11,#22130c)}
.kpi-card>span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.kpi-card b{font-family:Fraunces,Georgia,serif;font-size:24px;line-height:1.15;word-break:break-word}
.kpi-card small{font-size:11px;color:var(--mut)}
.kpi-card em{font-style:normal;font-size:12px;font-weight:700}
.kpi-card em.up{color:var(--ok)}.kpi-card em.down{color:var(--bad)}
.bi-bars{position:relative;display:flex;align-items:stretch;gap:3px;height:150px;margin-top:12px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 24.5%,#ffffff0d 25%)}
.bi-bars.thin{gap:1px}
.bi-col{flex:1;min-width:2px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:none;border:0;padding:0;cursor:pointer;position:relative;height:100%}
.bi-bar{display:block;width:100%;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px;transition:height .25s}
.bi-col.zero .bi-bar{background:var(--line)}
.bi-col.sel .bi-bar{background:var(--gold2);outline:2px solid var(--gold2)}
.bi-bars:has(.sel) .bi-col:not(.sel) .bi-bar{opacity:.4}
.bi-col small{position:absolute;bottom:-18px;font-size:9px;color:var(--mut);white-space:nowrap}
.bi-bars:has(small){margin-bottom:24px}
.bi-goal{position:absolute;left:0;right:0;border-top:2px dashed #cfa24f99;pointer-events:none;z-index:2}
.bi-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.bi-grid{grid-template-columns:1fr 1fr}}
.hrow.bi-h{width:100%;background:none;border:0;color:inherit;font:inherit;padding:6px 4px;border-radius:10px;cursor:pointer;text-align:left}
.hrow.bi-h.sel{background:#4d3a1544;outline:1px solid #7a6026}
.hrow .v2{min-width:70px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--txt)}
.heat{display:grid;grid-template-columns:36px repeat(7,1fr);gap:3px}
.hm-h{color:var(--mut);font-size:10px;display:flex;align-items:center;justify-content:center;min-height:24px}
.hm-c{border:0;border-radius:5px;min-height:26px;color:#1a0f0a;font-weight:700;font-size:10px;background:rgba(207,162,79,var(--a));cursor:pointer;padding:0}
.hm-c[style*="--a:0.00"]{background:#ffffff08;color:transparent}
.hm-c.sel{outline:2px solid var(--gold2)}
.seg.mini{margin:0;padding:2px;width:auto}.seg.mini button{padding:6px 12px;font-size:12px}
.sortable{cursor:pointer;user-select:none}
.totrow td{border-top:2px solid var(--line);background:#ffffff06}

/* ---- sistema do gerente ---- */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle;flex:none}
.rchip{display:inline-flex;align-items:center;gap:6px}
.rchip .dot{margin:0}
.mtable{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.mtable th{color:var(--mut);font-weight:700;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.mtable td{padding:11px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.mtable tr[data-act]{cursor:pointer}.mtable tr[data-act]:hover td{background:#ffffff08}
.mtable .best{color:var(--gold2);font-weight:800}
.mtable small{display:block;color:var(--mut);font-size:10px;font-weight:600}
.low{color:var(--mut)}
.lowtag{font-size:10px;font-weight:700;color:var(--warn);background:#4d3a1544;border-radius:99px;padding:2px 7px}
.stk{display:flex;align-items:stretch;gap:3px;height:160px;margin-top:12px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 24.5%,#ffffff0d 25%)}
.stk.thin{gap:1px}
.stk-col{flex:1;min-width:2px;display:flex;flex-direction:column-reverse;background:none;border:0;padding:0;cursor:pointer;position:relative;height:100%;justify-content:flex-start}
.stk-seg{display:block;width:100%;min-height:0}
.stk-col.sel{outline:2px solid var(--gold2)}
.stk:has(.sel) .stk-col:not(.sel){opacity:.4}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--mut)}
.linechart{width:100%;height:190px;display:block;margin-top:8px}
.linechart .grid{stroke:#ffffff14;stroke-width:1;vector-effect:non-scaling-stroke}
.linechart polyline{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.hbar .k{width:74px;flex:none}
.hbar .b{flex:1;height:12px;background:var(--card2);border-radius:99px;overflow:hidden}
.hbar .b>div{height:100%;border-radius:99px}
.hbar .v{min-width:84px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.drop{border:2px dashed #7a6026;border-radius:16px;padding:22px 14px;text-align:center;color:var(--mut);cursor:pointer;background:#ffffff05}
.drop.over{background:#4d3a1544;color:var(--txt)}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qgrid>div{min-width:0}
.qgrid input,.qgrid select{min-width:0;width:100%;box-sizing:border-box}
.qgrid label{margin:0 0 4px}
@media(min-width:760px){.qgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.note{font-size:13px;color:var(--mut);line-height:1.5}
.note b{color:var(--txt)}
.issue{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.issue:first-child{border-top:0}
.issue i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--mut)}
.issue.warn i{background:var(--warn)}
.statpill{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--card2)}
.statpill.ok{color:var(--ok)}.statpill.warn{color:var(--warn)}.statpill.bad{color:var(--bad)}
.kvlist .kv span:last-child{text-align:right}
.trendbig{font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:600}
.exbanner{background:#4d3a15;color:var(--gold2);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:12px}

</style>
</head>

/* Equipe, configuração e erro padrão do sistema. */
const TZ = 'America/Sao_Paulo';
const CFG = {
  blocks: ['A1', 'B1', 'C1', 'A2', 'B2', 'C2'],
  maxFloor: 28,
  presets: { 15: 500, 16: 520 },           // minutos previstos: 15h -> 23:20, 16h -> 00:40
  lateTol: 5 * 60e3, otTol: 10 * 60e3, early: 60 * 60e3, stale: 6 * 36e5, dupMs: 20e3, maxLate: 10,
  minRateSec: 180, minProjSec: 600,
  maxPhotoSide: 1800,
};
const FLOOR_BANDS = [['SS', 0, 0], ['1-7', 1, 7], ['8-14', 8, 14], ['15-21', 15, 21], ['22-28', 22, 28]];
// Equipe de entregadores. O gerente identifica cada pessoa por este id.
const ROSTER = [
  { id: 'pedro', nome: 'Pedro' }, { id: 'bruno', nome: 'Bruno' }, { id: 'joao', nome: 'João' },
  { id: 'kaua', nome: 'Kauã' }, { id: 'nicolas', nome: 'Nicolas' },
];
const plain = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const riderById = (id) => ROSTER.find((r) => r.id === id) || null;
const riderByName = (name) => riderById(plain(name).split(/\s+/)[0]);

class AppErr extends Error {
  constructor(code, message) { super(message); this.code = code; }
}

/* Atalhos de tela usados pelas camadas de interface. */
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Relógio e fuso (America/Sao_Paulo). `now()` é o único relógio do sistema. */
let clockOffset = 0, fixedNow = null;      // só testes
const now = () => fixedNow ?? Math.floor((Date.now() + clockOffset) / 1000) * 1000;   // precisão de 1 s, como o servidor
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

const mk = (o) => new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, ...o });
const F_TIME = mk({ hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const F_DM = mk({ day: '2-digit', month: '2-digit' });
const F_LONG = mk({ weekday: 'long', day: 'numeric', month: 'long' });
const F_SHORT = mk({ weekday: 'short', day: 'numeric', month: 'short' });
const F_PARTS = new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });

function parts(ms) {
  const o = {};
  for (const p of F_PARTS.formatToParts(new Date(ms))) o[p.type] = p.value;
  return o;
}
const ymdOf = (ms) => { const p = parts(ms); return `${p.year}-${p.month}-${p.day}`; };
const hourOf = (ms) => Number(parts(ms).hour) % 24;
/** Dia da semana no relógio de São Paulo: 0 = segunda ... 6 = domingo. */
const dowOfYmd = (ymd) => (new Date(ymd + 'T12:00:00Z').getUTCDay() + 6) % 7;
const dowOf = (ms) => dowOfYmd(ymdOf(ms));
/** Casa de 0 a 167 = dia da semana x hora (a mesma hora numa segunda e numa sexta são casas diferentes). */
const cellOf = (ms) => dowOf(ms) * 24 + hourOf(ms);
const fmtTime = (ms) => (ms == null ? '—' : F_TIME.format(new Date(ms)));
const fmtDM = (ms) => F_DM.format(new Date(ms));
const fmtDateTime = (ms) => `${fmtDM(ms)} ${fmtTime(ms)}`;
const ymdToDm = (ymd) => `${ymd.slice(8, 10)}/${ymd.slice(5, 7)}`;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const addDays = (ymd, n) => { const d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

/** data + hora do relógio de São Paulo -> milissegundos UTC (resolve o deslocamento iterando; trata horário de verão) */
function localToMs(ymd, h, mi = 0) {
  const [y, m, d] = ymd.split('-').map(Number);
  const target = Date.UTC(y, m - 1, d, h, mi);
  let guess = target;
  for (let i = 0; i < 4; i++) {
    const p = parts(guess);
    const shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute);
    const diff = target - shown;
    if (!diff) break;
    guess += diff;
  }
  return guess;
}

/* Formatação de números e dinheiro (centavos). */
function dur(sec) { const m = Math.round((sec || 0) / 60); return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`; }
const num1 = (n) => (n == null ? '—' : String(Math.round(n * 10) / 10).replace('.', ','));
const pct = (n) => (n == null ? '' : `${n >= 0 ? '+' : '−'}${Math.abs(Math.round(n))}%`);
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl = (cents) => (cents == null ? '—' : BRL.format(cents / 100));
/** "52", "52,5", "52,50", "R$ 1.234,56", "1234.56" -> centavos (inteiro). Vazio -> null. Inválido -> erro. */
function parseMoney(text) {
  let s = String(text ?? '').replace(/R\$/gi, '').replace(/\s+/g, '');
  if (!s) return null;
  if (!/^\d{1,3}(\.\d{3})*(,\d{1,2})?$|^\d+(,\d{1,2})?$|^\d+\.\d{1,2}$/.test(s)) throw new AppErr('INVALID_VALUE', 'Valor inválido. Exemplo: 52,90');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');   // 1.234 = mil duzentos e trinta e quatro
  const cents = Math.round(parseFloat(s) * 100);
  if (!Number.isFinite(cents) || cents < 0 || cents > 1000000) throw new AppErr('INVALID_VALUE', 'Valor fora do limite (até R$ 10.000,00).');
  return cents;
}

/* Conferências pequenas usadas ao ler dados de fora (disco, backup, arquivos). */
const isNum = (n) => typeof n === 'number' && Number.isFinite(n);
const isInt = (n) => Number.isInteger(n);
const str = (v, max) => String(v ?? '').slice(0, max);

/* Regras do pedido: bloco, apartamento e faixa de andar. */
/* ---------------- regras de ponto (porte das regras do servidor) ---------------- */
function normalizeApt(raw) {
  const apt = String(raw || '').replace(/\s+/g, '').toUpperCase();
  if (/^SS\d{1,2}$/.test(apt)) return { apt, floor: 0 };
  if (/^[1-9]\d{1,2}$/.test(apt)) {
    const n = parseInt(apt, 10), floor = Math.floor(n / 10), fin = n % 10;
    if (floor >= 1 && floor <= CFG.maxFloor && fin >= 1) return { apt: String(n), floor };
  }
  throw new AppErr('INVALID_APARTMENT', 'Apartamento inválido. Use andar+final (ex: 241) ou SS + número (ex: SS12).');
}
function normalizeBlock(raw) {
  const b = String(raw || '').trim().toUpperCase();
  if (!CFG.blocks.includes(b)) throw new AppErr('INVALID_BLOCK', `Bloco inválido. Use um destes: ${CFG.blocks.join(', ')}.`);
  return b;
}
function floorBand(f) {
  if (f == null) return null;
  const b = FLOOR_BANDS.find(([, lo, hi]) => f >= lo && f <= hi);

}

/* Regras da jornada: horas líquidas, pausas, ritmo, meta e avisos. */
function clipMerge(intervals, lo, hi) {

  const out = [];
  for (const [a, b] of c) {
    if (out.length && a <= out[out.length - 1][1]) out[out.length - 1][1] = Math.max(out[out.length - 1][1], b);

}

  return t;
}

function summarize(s, nowMs) {
  const end = Math.max(s.end ?? nowMs, s.start);
  const gross = Math.floor((end - s.start) / 1000);
  const merged = clipMerge(s.breaks.map((b) => [b.s, b.e ?? end]), s.start, end);
  const pause = Math.floor(overlapMs(merged, s.start, end) / 1000);
  const net = Math.max(0, gross - pause);
  const late = s.start - s.sched;
  const lateS = late > CFG.lateTol ? Math.floor(late / 1000) : 0;

  const status = s.end != null ? 'closed' : s.breaks.some((b) => b.e == null) ? 'on_break' : 'open';
  return { status, gross, pause, net, lateS, over, short, planned: Math.floor((s.plannedEnd - s.sched) / 1000) };
}

function paceOf(times, s, nowMs) {
  const end = s.end ?? nowMs;
  const merged = clipMerge(s.breaks.map((b) => [b.s, b.e ?? end]), s.start, end);
  const net = Math.max(0, Math.floor((end - s.start - overlapMs(merged, s.start, end)) / 1000));
  return { count: times.length, perHour: perHour(times.length, net), net };
}

function projectGoal(count, goal, pace, sm, nowMs, plannedEnd) {
  const remainingS = Math.max(0, Math.floor((plannedEnd - nowMs) / 1000));
  const remaining = Math.max(0, goal - count);
  const ok = sm.net >= CFG.minProjSec && pace.perHour > 0;
  let expected = ok && sm.status !== 'closed' ? Math.round(count + (pace.perHour * remainingS) / 3600) : null;
  if (sm.status === 'closed') expected = count;
  const required = remaining && remainingS > 0 ? Math.round((remaining / (remainingS / 3600)) * 10) / 10 : (remaining ? null : 0);
  const eta = remaining && ok && sm.status !== 'closed' ? nowMs + (remaining / pace.perHour) * 3600e3 : null;
  return { expected, goal, remaining, required, eta, onTrack: expected == null ? null : expected >= goal, remainingS };
}

/** Só avisos que pedem uma ação: meta batida, entregas para conferir e saída não batida. */
function shiftAlerts({ sm, nowMs, plannedEnd, count, goal, review }) {
  const out = [];
  if (sm.status === 'closed') return out;
  if (count >= goal) out.push({ id: 'goal_reached', severity: 'success', message: `Meta de ${goal} entregas batida. Continue assim!` });
  const past = Math.floor((nowMs - plannedEnd) / 1000);
  if (past * 1000 > CFG.otTol) out.push({ id: 'past_end', severity: 'warning', message: `Passou ${minOf(past)} min do horário de saída. Bata a saída quando terminar.` });
  if (review) out.push({ id: 'needs_review', severity: 'warning', message: `${review} entrega(s) para conferir.` });
  return out;
}

/* ============================================================

/* ============================================================

const RCOLORS = { pedro: '#e0a84a', bruno: '#4cc3b0', joao: '#ee7468', kaua: '#a596f5', nicolas: '#5fb4ee', equipe: '#a89c8a' };

/* ---------------- armazenamento (IndexedDB, com plano B no localStorage) ---------------- */

    const r = indexedDB.open('ponto-gerente', 1);

  }

}

    await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(ST, 'st'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });

/* Gerência: validação e junção dos arquivos dos entregadores. */
/* ---------------- validação e importação ---------------- */
class ImportErr extends Error {}

/** Limpa os turnos de um arquivo: descarta o que for inválido e conta o que foi descartado. */
function cleanShifts(raw, riderId) {
  if (!Array.isArray(raw)) throw new ImportErr('Arquivo sem a lista de turnos.');
  if (raw.length > 5000) throw new ImportErr('Arquivo grande demais.');
  const out = []; let dropped = 0, droppedShifts = 0;
  for (const s of raw) {
    if (!s || !isNum(s.entrada) || !isNum(s.previstoIni) || !isNum(s.previstoFim) || !/^\d{4}-\d{2}-\d{2}$/.test(String(s.data)) || s.previstoFim <= s.previstoIni
      || (s.saida != null && (!isNum(s.saida) || s.saida <= s.entrada))) { droppedShifts++; continue; }
    const sh = { id: str(s.id, 64) || `${riderId}-${s.data}-${s.entrada}`, data: s.data, preset: s.preset === 16 ? 16 : 15, previstoIni: s.previstoIni, previstoFim: s.previstoFim,

    for (const d of Array.isArray(s.entregas) ? s.entregas : []) {
      try {
        if (!d || !isNum(d.t)) throw new Error('t');
        const b = normalizeBlock(d.bloco), a = normalizeApt(d.apto);
        const e = { id: str(d.id, 64) || `${sh.id}-${d.t}`, t: d.t, bloco: b, apto: a.apt, andar: a.floor, valor: isInt(d.valor) && d.valor >= 0 && d.valor <= 1000000 ? d.valor : null,
          origem: d.origem === 'foto' || d.origem === 'photo' ? 'photo' : 'manual', conferir: !!d.conferir, original: null, editadaEm: isNum(d.editadaEm) ? d.editadaEm : null,
          excluida: !!d.excluida, excluidaEm: isNum(d.excluidaEm) ? d.excluidaEm : null,
          tardia: !!d.tardia && isNum(d.registradaEm), registradaEm: d.tardia && isNum(d.registradaEm) ? d.registradaEm : null };

/** Lê UM arquivo já convertido de JSON. Devolve uma lista de pacotes {rider, turnos, exp, ...} ou joga ImportErr. */
async function parsePackage(o) {
  if (!o || typeof o !== 'object') throw new ImportErr('Arquivo inválido.');
  if (o.formato === 'ponto-collina/consolidado' && Array.isArray(o.entregadores)) {
    const all = [];
    for (const e of o.entregadores) all.push(...await parsePackage(e));
    return all;
  }
  let riderId, turnosRaw, exp, integro = false;
  if (o.formato === EXPORT_FORMAT && o.versao === 2) {
    riderId = o.entregador?.id;
    if (!riderById(riderId)) throw new ImportErr(`Entregador desconhecido ("${str(riderId, 30)}"). Os nomes aceitos são: ${ROSTER.map((r) => r.nome).join(', ')}.`);
    turnosRaw = o.turnos;
    if (typeof o.integridade !== 'string' || !/^sha256:[0-9a-f]{64}$/.test(o.integridade)) throw new ImportErr('Arquivo sem código de integridade.');
    const calc = 'sha256:' + await sha256hex(canonical({ entregador: riderId, turnos: turnosRaw }));
    if (calc !== o.integridade) throw new ImportErr('O conteúdo do arquivo não confere com o código de integridade (arquivo alterado ou corrompido).');
    integro = true;
    exp = isNum(o.exportadoEm) ? o.exportadoEm : 0;
  } else throw new ImportErr('Formato não reconhecido. Use o arquivo gerado por “Enviar fechamento ao gerente”.');
  const c = cleanShifts(turnosRaw, riderId);
  return [{ rider: riderId, turnos: c.shifts, exp, exemplo: !!o.exemplo, integro, descartadas: c.dropped, turnosDescartados: c.droppedShifts }];
}

/** Junta um pacote aos dados já guardados. Para o mesmo turno vale a versão do arquivo mais recente. */
function mergePackage(p) {
  const r = riderById(p.rider);
  const cur = (ST.riders[p.rider] ||= { id: r.id, nome: r.nome, exportadoEm: 0, turnos: [] });
  const map = new Map(cur.turnos.map((s) => [s.id, s]));
  let novos = 0, atualizados = 0, mantidos = 0;
  for (const s of p.turnos) {
    const sh = { ...s, _exp: p.exp, _ex: p.exemplo };
    const old = map.get(s.id);
    if (!old) { map.set(s.id, sh); novos++; }
    else if (p.exp >= (old._exp || 0)) { map.set(s.id, sh); atualizados++; }
    else mantidos++;
  }
  cur.turnos = [...map.values()].sort((a, b) => a.entrada - b.entrada);
  cur.exportadoEm = Math.max(cur.exportadoEm || 0, p.exp);
  return { novos, atualizados, mantidos };
}

/** Importa vários arquivos. Devolve um relatório por arquivo; nada é aplicado de um arquivo inválido. */
async function importTexts(files) {                 // files: [{name, text}]

    try {
      let o;
      try { o = JSON.parse(f.text); } catch { throw new ImportErr('Não é um arquivo JSON válido.'); }
      const pkgs = await parsePackage(o);
      for (const p of pkgs) {

      }

      if (!(e instanceof ImportErr)) console.error(e);

  }
  await mSave();
  return report;
}

/** Arquivo único com tudo (backup do gerente / saída do consolidar.py). */
async function buildConsolidated() {
  const entregadores = [];
  for (const r of ROSTER) {

  }

}

/* Gerência: turnos calculados, períodos e fatias. */
/* ---------------- camada de cálculo ---------------- */
let MC = null;                                  // cache dos turnos calculados (zerado quando os dados mudam)
const hourStartMs = (ms) => { const p = parts(ms); return ms - (Number(p.minute) * 60 + Number(p.second)) * 1000; };

/** Segundos líquidos (sem pausas) por hora do dia (24) e por dia da semana x hora (168), para o índice ajustado. */
function netByHour(sh) {
  const hours = Array(24).fill(0), cells = Array(168).fill(0), end = sh.nowRef && sh.saida == null ? sh.nowRef : (sh.saida ?? sh.entrada);
  const merged = clipMerge(sh.pausas.map((p) => [p.i, p.f ?? end]), sh.entrada, end);
  let cur = sh.entrada;
  while (cur < end) {
    const hs = hourStartMs(cur), next = Math.min(end, hs + 3600000);
    const sec = Math.max(0, next - cur - overlapMs(merged, cur, next)) / 1000;
    hours[hourOf(cur)] += sec; cells[cellOf(cur)] += sec;
    cur = next;
  }
  return { hours, cells };
}

function compute() {
  if (MC) return MC;
  const shifts = [];
  for (const r of ROSTER) {
    const x = ST.riders[r.id]; if (!x) continue;
    for (const s of x.turnos) {
      if (isIgnored(r.id, s.id)) continue;
      const nowRef = s.saida == null ? Math.max(x.exportadoEm || 0, s.entrada) : s.saida;
      const core = { start: s.entrada, end: s.saida, sched: s.previstoIni, plannedEnd: s.previstoFim, breaks: s.pausas.map((p) => ({ s: p.i, e: p.f })) };
      const sm = summarize(core, nowRef);
      const dels = s.entregas.map((e) => ({ ...e, rid: r.id, sid: s.id, data: s.data }));
      const sh = { rid: r.id, id: s.id, data: s.data, preset: s.preset, previstoIni: s.previstoIni, previstoFim: s.previstoFim, entrada: s.entrada, saida: s.saida, auto: s.saidaAutomatica,
        pausas: s.pausas, nowRef, sm, ex: !!s._ex, dels, live: dels.filter((d) => !d.excluida) };
      const nb = netByHour(sh); sh.byHour = nb.hours; sh.byCell = nb.cells;
      shifts.push(sh);
    }
  }
  MC = { shifts };
  return MC;
}

/* ---------------- períodos e fatias ---------------- */
function mRange(period) {
  const today = ymdOf(now());
  if (period === 'hoje') return { from: today, to: today, days: 1 };
  if (period === 'mes') { const from = today.slice(0, 8) + '01'; return { from, to: today, days: Math.round((Date.parse(today) - Date.parse(from)) / 864e5) + 1 }; }
  if (period === 'tudo') {
    const all = compute().shifts, from = all.length ? all.reduce((m, s) => (s.data < m ? s.data : m), today) : today;
    return { from, to: today, days: Math.round((Date.parse(today) - Date.parse(from)) / 864e5) + 1, all: true };
  }
  const n = Number(period) || 30;
  return { from: addDays(today, -(n - 1)), to: today, days: n };
}
/** Turnos do período e do tipo de turno escolhido (todos os entregadores). */
function sliceShifts(R, preset) { return compute().shifts.filter((s) => s.data >= R.from && s.data <= R.to && (!preset || s.preset === preset)); }

/* Gerência: métricas, comparação e tendência (mesma regra para todos). */
/* ---------------- métricas (mesma regra para todos) ---------------- */
function aggregate(shifts) {
  let n = 0, sales = 0, nv = 0, net = 0, photo = 0, edited = 0, deleted = 0, all = 0, late = 0, over = 0, auto = 0, posted = 0;
  const days = new Set();
  for (const s of shifts) {
    net += s.sm.net; days.add(s.data); if (s.sm.lateS) late++; over += s.sm.over; if (s.auto) auto++;
    all += s.dels.length; deleted += s.dels.length - s.live.length;
    for (const d of s.live) { n++; if (d.valor != null) { sales += d.valor; nv++; } if (d.origem === 'photo') photo++; if (d.original) edited++; if (d.tardia) posted++; }
  }
  return {
    shifts: shifts.length, days: days.size, n, sales, nv, net, late, over, auto,
    perHour: net >= MIN_NET_FOR_RATE ? n / (net / 3600) : null, enough: net >= MIN_NET_FOR_RATE,
    ticket: nv ? sales / nv : null,
    coverage: n ? nv / n : null, photoPct: n ? photo / n : null, editedPct: n ? edited / n : null, postedPct: n ? posted / n : null, deletedPct: all ? deleted / all : null,
  };
}

const BENCH_PRIOR_SEC = 2 * 3600;             // peso do ritmo da hora ao estimar o ritmo de um dia da semana (evita ruído com poucos dados)

/** Ritmo de referência dos OUTROS entregadores (o próprio não entra na conta): por hora do dia e por dia da semana x hora. */
function benchmarkOf(others) {
  const hs = Array(24).fill(0), hd = Array(24).fill(0), cs = Array(168).fill(0), cd = Array(168).fill(0);
  for (const s of others) {
    s.byHour.forEach((v, h) => { hs[h] += v; });
    s.byCell.forEach((v, c) => { cs[c] += v; });
    for (const d of s.live) { hd[hourOf(d.t)]++; cd[cellOf(d.t)]++; }
  }
  return { hour: hs.map((v, h) => (v >= MIN_TEAM_HOURS ? { rate: hd[h] / (v / 3600), sec: v } : null)), cellSec: cs, cellDel: cd };
}
/** Entregas por hora esperadas numa casa (dia da semana x hora): o ritmo daquele dia, puxado para o ritmo da hora quando há pouco dado. null = sem referência. */
function expectedRate(bench, cell) {
  const hb = bench.hour[cell % 24];
  if (!hb) return null;
  const k = BENCH_PRIOR_SEC / 3600;
  return (bench.cellDel[cell] + k * hb.rate) / (bench.cellSec[cell] / 3600 + k);
}
/** Índice ajustado: entregas feitas ÷ entregas esperadas se o entregador tivesse o ritmo dos demais nos MESMOS dias da semana e horas. 100 = igual aos demais. */
function adjustedIndex(riderShifts, bench) {
  let actual = 0, expected = 0;
  for (const s of riderShifts) {
    s.byCell.forEach((v, c) => { if (v > 0) { const r = expectedRate(bench, c); if (r != null) expected += (v / 3600) * r; } });
    for (const d of s.live) if (expectedRate(bench, cellOf(d.t)) != null) actual++;
  }
  return expected >= MIN_EXPECTED ? { index: (actual / expected) * 100, actual, expected } : null;
}

const weekStart = (ymd) => { const d = new Date(ymd + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
/** Série semanal de entregas por hora de um grupo de turnos. */
function weeklyRate(shifts) {
  const m = {};
  for (const s of shifts) { const k = weekStart(s.data); const o = (m[k] ||= { n: 0, net: 0 }); o.n += s.live.length; o.net += s.sm.net; }
  return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0])).map(([w, o]) => ({ w, rate: o.net >= 3600 ? o.n / (o.net / 3600) : null, n: o.n, net: o.net }));
}
/** Tendência: média de entregas/h dos últimos turnos contra os turnos anteriores (precisa de pelo menos 6 turnos fechados). */
function trendOf(riderShifts) {
  const v = riderShifts.filter((s) => s.saida != null && s.sm.net >= 3600).sort((a, b) => a.entrada - b.entrada).map((s) => s.live.length / (s.sm.net / 3600));
  if (v.length < 6) return { enough: false, count: v.length };
  const k = Math.min(5, Math.floor(v.length / 2)), mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
  const last = mean(v.slice(-k)), prev = mean(v.slice(-2 * k, -k)), delta = prev > 0 ? ((last - prev) / prev) * 100 : null;
  return { enough: true, k, last, prev, delta, label: delta == null ? 'estável' : delta > 8 ? 'melhorando' : delta < -8 ? 'caindo' : 'estável' };
}

/* Gerência: consulta de registros e pontos de atenção. */
/* ---------------- consulta de registros ---------------- */
function allDeliveries() { return compute().shifts.flatMap((s) => s.dels); }
function queryDeliveries(q) {
  const apt = String(q.apt || '').trim().toUpperCase(), tFrom = q.tFrom ? q.tFrom.split(':').map(Number) : null, tTo = q.tTo ? q.tTo.split(':').map(Number) : null;
  const minOfDay = (ms) => { const p = parts(ms); return Number(p.hour) % 24 * 60 + Number(p.minute); };
  return allDeliveries().filter((d) => {
    if (q.riders?.size && !q.riders.has(d.rid)) return false;
    if (q.from && d.data < q.from) return false;
    if (q.to && d.data > q.to) return false;
    if (tFrom && minOfDay(d.t) < tFrom[0] * 60 + tFrom[1]) return false;
    if (tTo && minOfDay(d.t) > tTo[0] * 60 + tTo[1]) return false;
    if (q.block && d.bloco !== q.block) return false;
    if (apt && !d.apto.includes(apt)) return false;
    if (q.vMin != null && (d.valor == null || d.valor < q.vMin)) return false;
    if (q.vMax != null && (d.valor == null || d.valor > q.vMax)) return false;
    if (q.source && d.origem !== q.source) return false;
    if (q.status === 'normal' && (d.excluida || d.original || d.conferir)) return false;
    if (q.status === 'editada' && !d.original) return false;
    if (q.status === 'excluida' && !d.excluida) return false;
    if (q.status === 'conferir' && !d.conferir) return false;
    if (q.status === 'tardia' && !d.tardia) return false;
    return true;
  });
}
/** 35 min · 1h05 */
const fmtLag = (ms) => { const m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`; };
const statusOf = (d) => (d.excluida ? 'Excluída' : d.original ? 'Corrigida' : d.conferir ? 'Para conferir' : 'Normal');

/** Com a conexão automática ligada, "último envio" é só a última atividade do entregador: folga não é atraso. */
const isLinked = () => !!syncConfig();
const MAX_LATE_SHARE = 0.10;                  // acima disso, entregas lançadas depois viram ponto de atenção
/** Situação do envio de um entregador: { cls, text }. */
function freshness(x) {
  if (isLinked()) return { cls: 'ok', text: 'automático' };
  const age = (now() - x.exportadoEm) / 864e5;
  return age > STALE_DAYS ? { cls: 'warn', text: `há ${Math.floor(age)} dias` } : { cls: 'ok', text: 'em dia' };
}

/** Pontos de atenção na base. */
function dataQuality() {
  const items = [];
  const shifts = compute().shifts;
  for (const r of ROSTER) {
    const x = ST.riders[r.id];
    if (!x) { items.push({ level: 'warn', text: `${r.nome}: ${isLinked() ? 'ainda não enviou nada pela conexão automática' : 'nenhum arquivo importado ainda'}.` }); continue; }
    const age = (now() - x.exportadoEm) / 864e5;
    if (!isLinked() && age > STALE_DAYS) items.push({ level: 'warn', text: `${r.nome}: dados só até ${fmtDateTime(x.exportadoEm)} (${Math.floor(age)} dias atrás). Peça um novo fechamento.` });
    if (x.exportadoEm > now() + 10 * 60000) items.push({ level: 'warn', text: `${r.nome}: o relógio do aparelho está adiantado (envio marcado para ${fmtDateTime(x.exportadoEm)}). Os horários dele podem estar errados.` });
    const turnos = activeTurnos(r.id), byDate = {};
    for (const s of turnos) byDate[s.data] = (byDate[s.data] || 0) + 1;
    const dup = Object.entries(byDate).filter(([, n]) => n > 1).map(([d]) => ymdToDm(d));
    if (dup.length) items.push({ level: 'warn', text: `${r.nome}: mais de um turno no mesmo dia (${dup.slice(0, 5).join(', ')}). Pode ser outro aparelho; use "Ignorar" no turno que sobrar.` });
    const open = turnos.filter((s) => s.saida == null).length;
    if (open) items.push({ level: 'info', text: `${r.nome}: ${open} turno(s) sem saída batida.` });
    const mine = shifts.filter((s) => s.rid === r.id), n = mine.reduce((a, s) => a + s.live.length, 0), late = mine.reduce((a, s) => a + s.live.filter((d) => d.tardia).length, 0);
    if (late >= 5 && n && late / n > MAX_LATE_SHARE) items.push({ level: 'warn', text: `${r.nome}: ${Math.round((late / n) * 100)}% das entregas (${late} de ${n}) foram lançadas depois, como esquecidas. Vale conferir em Consultas → Situação.` });
  }
  if (Object.values(ST.riders).some((x) => x.turnos.some((s) => s._ex))) items.unshift({ level: 'warn', text: 'Há dados de EXEMPLO misturados. Remova-os em Dados antes de analisar.' });
  return items;
}

/* ============================================================
   Gerência: conexão automática - busca o que os entregadores enviaram (repositório privado do GitHub).
   ============================================================ */
let ETAGS = {};
try { ETAGS = JSON.parse(localStorage.getItem('ponto-gerente:etags') || '{}') || {}; } catch { ETAGS = {}; }
const saveEtags = () => { if (!MPERSIST) return; try { localStorage.setItem('ponto-gerente:etags', JSON.stringify(ETAGS)); } catch { /* ignore */ } };
const PULL = { busy: false, at: null, err: null, report: [] };

/** Baixa o arquivo de cada entregador (só os que mudaram), confere a integridade e junta à base. */
async function syncPull({ force = false } = {}) {
  const cfg = syncConfig();
  if (!cfg || PULL.busy) return null;
  PULL.busy = true; PULL.err = null;
  const report = []; let changed = 0;
  try {
    for (const r of ROSTER) {
      const g = await ghGetFile(cfg, `entregas/${r.id}.json`, force || !ST.riders[r.id] ? null : ETAGS[r.id]);       // sem dado guardado, baixa de novo
      if (g.status === 304) { report.push({ id: r.id, estado: 'igual' }); continue; }
      if (g.status === 404) { report.push({ id: r.id, estado: 'sem arquivo' }); continue; }
      let dono = null;
      try { dono = JSON.parse(g.text)?.entregador?.id; } catch { /* importTexts explica */ }
      if (dono && dono !== r.id) { report.push({ id: r.id, estado: 'erro', erro: 'O arquivo desta pasta pertence a outro entregador.' }); continue; }
      const x = (await importTexts([{ name: `nuvem · ${r.nome}`, text: g.text }]))[0];
      if (x && x.ok) { ETAGS[r.id] = g.etag; changed++; report.push({ id: r.id, estado: 'atualizado', ...x }); }
      else report.push({ id: r.id, estado: 'erro', erro: x ? x.erro : 'Arquivo ilegível.' });
    }
    saveEtags();
    if (changed) await mSave();
    PULL.at = Date.now();
  } catch (e) {
    PULL.err = e instanceof SyncErr ? e.message : 'Não consegui atualizar agora.';
  } finally { PULL.busy = false; PULL.report = report; }
  return { changed, report };
}

function stackedDays(shifts, R) {
  const days = [], total = Math.min(R.days, 62);
  for (let i = total - 1; i >= 0; i--) days.push(addDays(R.to, -i));
  const by = {};
  for (const s of shifts) { const o = (by[s.data] ||= {}); o[s.rid] = (o[s.rid] || 0) + s.live.length; }
  const tot = (d) => Object.values(by[d] || {}).reduce((a, b) => a + b, 0), mx = Math.max(1, ...days.map(tot));
  return `<div class="stk${days.length > 31 ? ' thin' : ''}">${days.map((d) => {
    const segs = ROSTER.filter((r) => by[d]?.[r.id]).map((r) => `<i class="stk-seg" style="height:${(by[d][r.id] / mx) * 100}%;background:${RCOLORS[r.id]}"></i>`).join('');
    const tip = ROSTER.filter((r) => by[d]?.[r.id]).map((r) => `${r.nome} ${by[d][r.id]}`).join(' · ');
    return `<button class="stk-col${MG.day === d ? ' sel' : ''}" data-act="m-day" data-d="${d}" title="${ymdToDm(d)}: ${tip || 'sem entregas'}" aria-label="${ymdToDm(d)}: ${tot(d)} entregas">${segs}</button>`;
  }).join('')}</div><div class="axis"><span>${ymdToDm(days[0])}</span><span>máx ${mx} entregas/dia</span><span>${ymdToDm(days[days.length - 1])}</span></div>`;
}
actions['m-day'] = (el) => { MG.day = MG.day === el.dataset.d ? null : el.dataset.d; mRefresh(); };

function lineChart(series) {                    // series: [{id, pts:[{w, rate}]}]
  const weeks = [...new Set(series.flatMap((s) => s.pts.map((p) => p.w)))].sort();
  if (weeks.length < 2) return '<div class="empty">São necessárias pelo menos 2 semanas de dados para mostrar a evolução.</div>';
  const vals = series.flatMap((s) => s.pts.map((p) => p.rate)).filter((v) => v != null), mx = Math.max(1, ...vals) * 1.1;
  const X = (i) => 4 + (i / (weeks.length - 1)) * 592, Y = (v) => 176 - (v / mx) * 168;
  const grid = [0.25, 0.5, 0.75, 1].map((f) => `<line class="grid" x1="0" x2="600" y1="${Y(mx * f)}" y2="${Y(mx * f)}"/>`).join('');
  const lines = series.map((s) => {
    const pts = weeks.map((w, i) => { const p = s.pts.find((q) => q.w === w); return p && p.rate != null ? `${X(i).toFixed(1)},${Y(p.rate).toFixed(1)}` : null; }).filter(Boolean);
    return pts.length > 1 ? `<polyline points="${pts.join(' ')}" style="stroke:${RCOLORS[s.id]}"/>` : '';
  }).join('');
  return `<svg class="linechart" viewBox="0 0 600 180" preserveAspectRatio="none" role="img" aria-label="Evolução semanal de entregas por hora">${grid}${lines}</svg>
    <div class="axis"><span>sem. de ${ymdToDm(weeks[0])}</span><span>entregas por hora · máx ${num(mx / 1.1)}</span><span>sem. de ${ymdToDm(weeks[weeks.length - 1])}</span></div>
    <div class="legend">${series.map((s) => `<span>${rdot(s.id)}${esc(rname(s.id))} ${(() => { const l = [...s.pts].reverse().find((p) => p.rate != null); return l ? `<b style="color:var(--txt)">${num(l.rate)}</b>` : ''; })()}</span>`).join('')}</div>`;
}

function heatmap(shifts) {
  const grid = {}; let mx = 0, hmin = 24, hmax = -1, n = 0;
  for (const s of shifts) for (const d of s.live) {
    const h = hourOf(d.t), dw = (new Date(s.data + 'T12:00:00Z').getUTCDay() + 6) % 7, k = dw * 24 + h;
    grid[k] = (grid[k] || 0) + 1; mx = Math.max(mx, grid[k]); hmin = Math.min(hmin, h); hmax = Math.max(hmax, h); n++;
  }
  if (!n) return '<div class="empty">Sem dados.</div>';
  const L = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'], cells = [`<div class="hm-h"></div>${L.map((d) => `<div class="hm-h">${d}</div>`).join('')}`];
  for (let h = hmin; h <= hmax; h++) {
    cells.push(`<div class="hm-h">${String(h).padStart(2, '0')}h</div>`);
    for (let d = 0; d < 7; d++) { const v = grid[d * 24 + h] || 0; cells.push(`<div class="hm-c" style="--a:${v ? (0.15 + 0.85 * v / mx).toFixed(2) : '0.00'};cursor:default" title="${L[d]} ${String(h).padStart(2, '0')}h: ${v}">${v || ''}</div>`); }
  }
  return `<div class="heat">${cells.join('')}</div>`;
}

function hbars(entries, color) {              // entries: [[label, n, v]]
  const mx = Math.max(1, ...entries.map((e) => e[1]));
  return entries.map(([k, n, v]) => `<div class="hbar"><span class="k">${esc(k)}</span><span class="b"><div style="width:${(n / mx) * 100}%;background:${color}"></div></span><span class="v">${n}${v ? ` · ${brl(v)}` : ''}</span></div>`).join('');
}
function distBlock(shifts) {
  const b = {}, a = {};
  for (const s of shifts) for (const d of s.live) { const x = (b[d.bloco] ||= [0, 0]); x[0]++; x[1] += d.valor || 0; const k = floorBand(d.andar); if (k) { const y = (a[k] ||= [0, 0]); y[0]++; y[1] += d.valor || 0; } }
  return {
    blocks: CFG.blocks.map((k) => [k, b[k]?.[0] || 0, b[k]?.[1] || 0]),
    bands: FLOOR_BANDS.map(([k]) => [k === 'SS' ? 'Subsolo' : `${k.replace('-', '–')}º andar`, a[k]?.[0] || 0, a[k]?.[1] || 0]),
  };
}

function prevRange(R) { return R.all ? null : { from: addDays(R.from, -R.days), to: addDays(R.from, -1), days: R.days }; }

function renderGeral(el) {
  if (!hasData()) { el.innerHTML = slicers(null) + emptyState(); return; }
  const R = mRange(MG.period), base = sliceShifts(R, MG.preset);
  const ids = ROSTER.map((r) => r.id).filter((id) => base.some((s) => s.rid === id) || ST.riders[id]);
  const shown = ids.filter((id) => !MG.sel.size || MG.sel.has(id));
  let shifts = base.filter((s) => shown.includes(s.rid));
  if (MG.day) shifts = shifts.filter((s) => s.data === MG.day);
  const K = aggregate(shifts), P = prevRange(R), PK0 = P ? aggregate(sliceShifts(P, MG.preset).filter((s) => shown.includes(s.rid))) : null;
  const PK = PK0 && PK0.shifts >= 3 ? PK0 : null;                           // comparar com um período quase vazio só assusta (ex.: +4900%)
  const rows = shown.map((id) => {
    const rs = shifts.filter((s) => s.rid === id), a = aggregate(rs), adj = adjustedIndex(rs, benchmarkOf(base.filter((s) => s.rid !== id))), t = trendOf(base.filter((s) => s.rid === id));
    return { id, a, adj, t, last: ST.riders[id]?.exportadoEm || 0 };
  });
  const best = (f, dir = 1) => { const v = rows.filter((r) => r.a.enough && f(r) != null).map(f); return v.length > 1 ? (dir > 0 ? Math.max(...v) : Math.min(...v)) : null; };
  const bPH = best((r) => r.a.perHour), bIx = best((r) => r.adj?.index);      // só ritmo e índice recebem destaque: valor vendido depende da comanda, não do entregador
  const cell = (r, v, text, bestV) => (!r.a.enough ? `<td class="low">—</td>` : `<td class="${bestV != null && v === bestV ? 'best' : ''}">${text}</td>`);
  const table = `<div class="scroll"><table class="mtable"><tr><th>Entregador</th><th>Turnos</th><th>Horas</th><th>Entregas</th><th>Entr./h</th><th>Índice</th><th>Vendido</th><th>Ticket</th><th>Com valor</th><th>Tendência</th></tr>
    ${rows.map((r) => `<tr data-act="m-open" data-id="${r.id}"><td>${rlabel(r.id)}${r.a.shifts && !r.a.enough ? ' <span class="lowtag">poucos dados</span>' : ''}${!r.a.shifts ? ' <span class="lowtag">sem turnos</span>' : ''}<small>dados até ${r.last ? fmtDateTime(r.last) : '—'}</small></td>
      <td>${r.a.shifts}</td><td>${dur(r.a.net)}</td><td>${r.a.n}</td>
      ${cell(r, r.a.perHour, num(r.a.perHour), bPH)}${cell(r, r.adj?.index, r.adj ? Math.round(r.adj.index) : '—', bIx)}<td>${brl(r.a.sales)}</td>
      <td>${r.a.ticket != null ? brl(Math.round(r.a.ticket)) : '—'}</td>
      <td>${pc(r.a.coverage)}</td><td class="${r.t.enough ? (r.t.label === 'melhorando' ? 'best' : r.t.label === 'caindo' ? 'bad' : '') : 'low'}">${r.t.enough ? `${r.t.label} ${dtag(r.t.delta)}` : '—'}</td></tr>`).join('')}</table></div>
    <p class="note" style="margin:10px 0 0"><b>Entr./h</b> = entregas por hora líquida (sem pausas). <b>Índice</b> compara com o ritmo dos demais entregadores nos mesmos dias da semana e horas (100 = igual aos demais). Vendido e ticket são informação: dependem da comanda, por isso não recebem destaque. “—” = menos de 4 h no período. <button class="linkbtn" data-act="m-method">Como a comparação é feita</button></p>`;
  const dist = distBlock(shifts), team = rows.map((r) => ({ id: r.id, pts: weeklyRate(shifts.filter((s) => s.rid === r.id)) }));
  const ex = Object.values(ST.riders).some((x) => x.turnos.some((s) => s._ex));

    ${ex ? '<div class="exbanner">Há dados de EXEMPLO misturados nesta base. Remova em Dados antes de usar os números.</div>' : ''}
    <p class="mut bi-range">${R.from === R.to ? ymdToDm(R.from) : `${ymdToDm(R.from)} a ${ymdToDm(R.to)}`}${MG.preset ? ` · turno ${MG.preset}h` : ''}${MG.day ? ` · dia ${ymdToDm(MG.day)}` : ''} · ${K.shifts} turnos</p>
    <div class="bi-kpis">
      <div class="kpi-card"><span>Entregas</span><b>${K.n}</b>${dtag(PK ? delta(K.n, PK.n) : null)}</div>

      <div class="kpi-card"><span>Entregas por hora</span><b>${num(K.perHour)}</b>${dtag(PK && K.perHour != null ? delta(K.perHour, PK.perHour) : null)}<small>${dur(K.net)} líquidas · ${K.days} dias</small></div></div>
    <div class="card"><div class="row-between" style="margin-bottom:10px"><h2 style="margin:0">Desempenho por entregador</h2></div>${table}</div>
    <div class="card"><h2>Entregas por dia</h2>${stackedDays(base.filter((s) => shown.includes(s.rid)), R)}<div class="legend">${shown.map((id) => `<span>${rdot(id)}${esc(rname(id))}</span>`).join('')}</div><p class="mut" style="font-size:12px;margin:8px 0 0">Toque em um dia para filtrar a tela.</p></div>

}
actions['m-open'] = (el) => { MG.rider = el.dataset.id; MG.tab = 'ind'; mRender(); window.scrollTo(0, 0); };

actions['m-method'] = () => sheet(`<h3>Como a comparação é feita</h3>
  <div class="note"><p>Todos os entregadores passam pelas <b>mesmas regras</b>, calculadas só com os arquivos de fechamento que eles enviaram.</p>
  <p><b>Horas líquidas</b> = tempo entre a entrada e a saída, sem as pausas. Turno ainda aberto conta até o momento do envio.</p>
  <p><b>Entregas por hora</b> = entregas ÷ horas líquidas. Só é mostrado com <b>4 h ou mais</b> no período; antes disso aparece “poucos dados” e o entregador não entra no destaque.</p>
  <p><b>Índice</b> = entregas feitas ÷ entregas esperadas se ele tivesse o ritmo dos <b>demais entregadores</b> (ele próprio fica fora da conta) nos <b>mesmos dias da semana e horas</b>. Isso corrige a diferença de movimento entre horários e entre dias (quem pega segunda-feira ou uma hora mais fraca não é penalizado). Quando um dia da semana tem pouco dado, o ritmo é puxado para o da hora. 100 = igual aos demais, 120 = 20% acima. Só aparece com pelo menos 5 entregas esperadas.</p>
  <p><b>Vendido</b> e <b>ticket</b> somam o valor das comandas informadas. É informação, não nota: o valor depende do cliente e do pedido, não do entregador, por isso nenhum deles recebe destaque nem entra em ranking. Veja <b>Com valor</b>: quem informa menos valores aparece com vendido menor.</p>
  <p><b>Tendência</b> compara a média de entregas/h dos últimos turnos com a dos turnos anteriores (mínimo de 6 turnos fechados): acima de +8% = melhorando, abaixo de −8% = caindo.</p>
  <p><b>Entregas excluídas</b> não contam. <b>Corrigidas</b> contam com o valor corrigido e ficam marcadas em Consultas, com o original.</p>
  <p>Não existe nota única: cada número mostra uma dimensão, para a decisão ficar com você.</p></div>
  <button class="btn" id="mClose" style="margin-top:14px">Fechar</button>`) || ($('mClose').onclick = closeSheet);

      <div class="kpi-card strong"><span>Índice ajustado</span><b>${adj ? Math.round(adj.index) : '—'}</b><small>${adj ? `${adj.actual} feitas · ${num(adj.expected, 0)} esperadas` : 'dados insuficientes'}</small></div>

actions['m-shift'] = (el) => {
  const s = compute().shifts.find((x) => x.rid === el.dataset.r && x.id === el.dataset.s);
  if (!s) return;

    <p id="cErr" class="lerr" role="alert" style="text-align:left;margin:8px 0 0"></p>

function bindConnect() {
  const go = $('cGo');
  if (!go) return;
  go.onclick = () => busy(go, async () => {
    const err = (m) => { $('cErr').textContent = m || ''; };
    err('');
    const repo = $('cRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/+$/, ''), token = $('cTok').value.trim();
    if (!validRepo(repo)) return err('Escreva o repositório assim: dono/nome.');
    if (!validToken(token)) return err('Cole o token inteiro (começa com github_pat_ ou ghp_).');
    try {
      const info = await ghCheck({ repo, token });
      setSyncConfig({ repo, token });
      PULL.err = null;
      toast(info.private ? 'Conectado' : 'Conectado (atenção: este repositório é público)', 3500);
      await syncPull({ force: true });
      mRender();
      showLink();
    } catch (e) { err(e instanceof SyncErr ? e.message : 'Não consegui conectar.'); }
  });
}
/** Link que o gerente manda aos entregadores. */

  sheet(`<h3>Link para os entregadores</h3>
    <p class="mut" style="font-size:14px">Mande para cada entregador abrir <b>uma vez</b> no celular dele. A conexão fica guardada e os registros passam a chegar sozinhos.</p>

async function handleFiles(files) {

  for (const f of files) texts.push({ name: f.name, text: f.size > 20 * 1024 * 1024 ? '' : await f.text() });
  const rep = await importTexts(texts);
  mRender();
  const ok = rep.filter((r) => r.ok).length;
  sheet(`<h3>${ok} de ${rep.length} arquivo(s) importado(s)</h3>${rep.map((r) => r.ok
    ? `<div class="issue"><i style="background:var(--ok)"></i><span><b>${esc(r.entregador)}</b> · ${esc(r.nome)}<br>${r.novos} turno(s) novo(s), ${r.atualizados} atualizado(s)${r.mantidos ? `, ${r.mantidos} mantido(s) (versão mais antiga ignorada)` : ''}${r.descartadas ? `<br><span class="warnc">${r.descartadas} registro(s) inválido(s) descartado(s)</span>` : ''}${r.exemplo ? '<br><span class="warnc">Dados de EXEMPLO.</span>' : ''}</span></div>`
    : `<div class="issue warn"><i style="background:var(--bad)"></i><span><b>${esc(r.nome)}</b><br>${esc(r.erro)}</span></div>`).join('')}
    <button class="btn gold" id="mClose" style="margin-top:14px">Ok</button>`);
  $('mClose').onclick = closeSheet;
}
$('mfile').addEventListener('change', (e) => { const f = [...e.target.files]; e.target.value = ''; handleFiles(f); });
actions['m-export'] = async () => { const c = await buildConsolidated(); download(`consolidado-${ymdOf(now())}.json`, JSON.stringify(c), 'application/json'); toast('Arquivo consolidado gerado'); };
actions['m-rmex'] = async () => {
  let n = 0;
  for (const x of Object.values(ST.riders)) { const before = x.turnos.length; x.turnos = x.turnos.filter((s) => !s._ex); n += before - x.turnos.length; }
  for (const id of Object.keys(ST.riders)) if (!ST.riders[id].turnos.length) delete ST.riders[id];
  await mSave(); mRender(); toast(`${n} turno(s) de exemplo removido(s)`);
};
actions['m-wipe'] = async (el) => {
  if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = 'Toque de novo para apagar TUDO'; return; }
  ST = novoEstado(); ETAGS = {}; saveEtags(); await mSave(); mRender(); toast('Dados apagados deste navegador');
};

async function mgrBoot() {
  document.querySelectorAll('img[data-logo]').forEach((i) => { i.src = LOGO; });
  $('ico').href = LOGO; $('ico2').href = LOGO;
  await mLoad();
  buildMNav(); $('boot').classList.add('hide'); $('app').classList.remove('hide');
  const first = ROSTER.find((r) => ST.riders[r.id]); if (first && !ST.riders[MG.rider]) MG.rider = first.id;
  mRender();
  pullTick();
  setInterval(pullTick, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pullTick(); });
}

mgrBoot();
</script>
</body>
